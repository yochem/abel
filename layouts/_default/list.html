{{ define "main" }}
<main>
	<h2>Publicaties</h2>
	{{ range (where site.Pages "Section" "publicaties") }}
	<a class="nodecoration" href='{{ cond (isset .Params "link") .Params.link .RelPermalink }}'>
		<article>
			<h3>{{ .Title | markdownify }} ({{ .Date.Year }})</h3>
			<p>{{ .Summary | truncate 300 }}</p>
		</article>
	</a>
	{{ end }}
</main>
{{ end }}
